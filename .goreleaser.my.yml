project_name: filebrowser-my

before:
  hooks:
    - go mod tidy

builds:
  - id: filebrowser-my
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
      - freebsd
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: freebsd
        goarch: arm64
    ldflags:
      - -s -w -X github.com/filebrowser/filebrowser/v2/version.Version={{.Version}}
    binary: filebrowser

archives:
  - id: filebrowser-my
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: "filebrowser-my_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

dockers:
  - image_templates:
      - "{{ .Env.DOCKER_USERNAME }}/filebrowser:{{ .Tag }}-amd64"
      - "{{ .Env.DOCKER_USERNAME }}/filebrowser:latest-amd64"
    dockerfile: Dockerfile.alpine
    use: buildx
    build_flag_templates:
      - --platform=linux/amd64
      - --label=org.opencontainers.image.title={{ .ProjectName }}
      - --label=org.opencontainers.image.version={{ .Version }}

docker_manifests:
  - name_template: "{{ .Env.DOCKER_USERNAME }}/filebrowser:{{ .Tag }}"
    image_templates:
      - "{{ .Env.DOCKER_USERNAME }}/filebrowser:{{ .Tag }}-amd64"
  - name_template: "{{ .Env.DOCKER_USERNAME }}/filebrowser:latest"
    image_templates:
      - "{{ .Env.DOCKER_USERNAME }}/filebrowser:latest-amd64"

release:
  github:
    owner: "{{ .Env.GITHUB_REPOSITORY_OWNER }}"
    name: "{{ .Env.GITHUB_REPOSITORY }}"
  name_template: "My Branch Release {{ .Tag }}"
  prerelease: true